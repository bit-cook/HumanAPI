services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://humanapi:humanapi@postgres:5432/humanapi?schema=public
      APP_URL: http://localhost:3000
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: humanapi
      POSTGRES_USER: humanapi
      POSTGRES_PASSWORD: humanapi
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U humanapi -d humanapi"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
